<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find your WoW Forever main</title>
  <link rel="icon" type="image/jpeg" href="assets/icons/inv_misc_book_07.jpg">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <nav id="nav"></nav>
  <main id="app"></main>
  <div id="turnstile" class="human-check" role="dialog" aria-modal="true" aria-labelledby="human-check-title" hidden>
    <div class="human-check-box">
      <h2 id="human-check-title">Confirm you're human</h2>
      <p>The trainer only answers real adventurers. Complete the check to continue.</p>
      <div class="human-check-slot"></div>
      <button type="button" class="human-check-cancel">Cancel</button>
    </div>
  </div>
</body>
</html>
